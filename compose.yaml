services:
  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - deals-data:/data
      - ./config.json:/app/config.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  deals-data:
